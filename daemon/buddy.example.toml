# Claude Buddy configuration — copy to:
#   ~/.config/claude-usage-monitor/buddy.toml
# Everything here is optional. With no config, the buddy is derived
# deterministically from your account identity (stable across runs/reflashes).
#
# Identity precedence (highest first):
#   1. [overrides] fields below  — pinned verbatim, bypass generation
#   2. seed (or $BUDDY_SEED env) — hash any string to a reproducible buddy
#   3. account identity          — the default

# Override the account identity with any string to reroll a custom buddy.
# Same string always yields the same species/rarity/stats.
# seed = "my-favorite-seed"

# Pin specific fields; anything omitted is still generated from the identity.
# [overrides]
# species = "dragon"     # duck goose blob cat dragon octopus owl penguin turtle
#                        # snail ghost axolotl capybara cactus robot rabbit
#                        # mushroom chonk wyvern pikachu
# rarity  = "legendary"  # common uncommon rare epic legendary
# hat     = "crown"      # none crown tophat propeller halo wizard beanie tinyduck
# name    = "Sparky"     # shown on the device (max 15 chars)
# stats   = { debug = 99, patience = 10, chaos = 80, wisdom = 70, snark = 88 }

# Remarks — the buddy occasionally "says" something in a speech bubble on the
# device, reacting to mood + usage (and, once hooks are wired, your coding).
# All of these are re-read every poll, so changes take effect without
# restarting the daemon.
# [remarks]
# enabled       = true   # master switch for speech bubbles
# cooldown_secs = 120    # minimum gap between remarks
# bubble_secs   = 7      # how long the speech bubble stays on screen (1..60).
#                        # Also used by the device's LEFT+RIGHT phrase combo.
# chattiness    = 0.6    # 0..1 chance of speaking when eligible (lower = quieter)
# foreground    = false  # true → a new remark pops the buddy screen to the front
# llm_rate      = 0.0    # 0..1 chance a remark is freshly generated by the model
#                        # instead of picked from the curated lists. Uses your
#                        # Claude Code OAuth token (counts against your usage);
#                        # 0 = free, curated-only. Curated line is the fallback.
# model         = "claude-haiku-4-5"  # model used when llm_rate fires

# Appearance — the device tints elements with the buddy's rarity color
# (common=gray, uncommon=green, rare=blue, epic=purple, legendary=gold; ported
# from upstream claude-buddy, common gray brightened for the black AMOLED).
# Choose which elements get tinted. Re-read every poll.
# [appearance]
# rarity_color_stars    = true   # the ★ row
# rarity_color_name     = false  # the name + level line
# rarity_color_creature = true   # the ASCII creature itself
